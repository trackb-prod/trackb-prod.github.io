name: BrandForge Quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: brandforge-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
